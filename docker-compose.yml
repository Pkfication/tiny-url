version: '3.8'

services:
  zookeeper:
    image: zookeeper:3.8
    ports:
      - "2181:2181"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.13
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.13
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  apm-server:
    image: docker.elastic.co/apm/apm-server:7.17.13
    command: >
      apm-server -e
      -E apm-server.rum.enabled=true
      -E setup.kibana.host=kibana:5601
      -E setup.template.settings.index.number_of_replicas=0
      -E apm-server.kibana.enabled=true
      -E apm-server.kibana.host=kibana:5601
      -E output.elasticsearch.hosts=["elasticsearch:9200"]
    ports:
      - "8200:8200"
    depends_on:
      - elasticsearch
      - kibana

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - kgs
      - write-service
      - read-service

  kgs:
    build:
      context: .
      args:
        - SERVICE_NAME=kgs
    environment:
      - ZK_SERVERS=zookeeper:2181
      - PORT=8080
      - ELASTIC_APM_SERVER_URL=http://apm-server:8200
      - ELASTIC_APM_SERVICE_NAME=kgs-service
      - ELASTIC_APM_ENVIRONMENT=local
    depends_on:
      - zookeeper
      - apm-server

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  write-service:
    build:
      context: .
      args:
        - SERVICE_NAME=write-service
    environment:
      - PORT=8081
      - KGS_URL=http://kgs:8080/key
      - REDIS_ADDR=redis:6379
      - ELASTIC_APM_SERVER_URL=http://apm-server:8200
      - ELASTIC_APM_SERVICE_NAME=write-service
      - ELASTIC_APM_ENVIRONMENT=local
    depends_on:
      - kgs
      - redis
      - apm-server

  read-service:
    build:
      context: .
      args:
        - SERVICE_NAME=read-service
    environment:
      - PORT=8082
      - REDIS_ADDR=redis:6379
      - ELASTIC_APM_SERVER_URL=http://apm-server:8200
      - ELASTIC_APM_SERVICE_NAME=read-service
      - ELASTIC_APM_ENVIRONMENT=local
    depends_on:
      - redis
      - apm-server
